experiment:
  name: "protein_structure_value_benchmark"
  seed: 42
  device: "cuda"

data:
  raw_pdb_dir: "data/raw_pdbs"
  cache_dir: "data/cached_embeddings"
  checkpoint_dir: "checkpoints"
  manifest_path: "data/curated_manifest.csv"
  max_seq_len: 512
  min_seq_len: 40
  cluster_identity_cutoff: 0.30
  n_folds: 5

features:
  esm_model_name: "esm2_t12_35M_UR50D"
  contact_distance_cutoff: 8.0 # Angstroms
  use_dihedral_features: true

models:
  hidden_dim: 128
  num_gnn_layers: 2
  dropout: 0.2
  num_classes: 6

training:
  epochs: 40
  lr_seq: 0.001
  lr_struct: 0.001
  lr_hybrid: 0.0005
  weight_decay: 0.0001
  early_stopping_patience: 10
  ablation_fractions: [0.25, 0.50, 1.00]
  ablation_seeds: [42, 101, 2024]
